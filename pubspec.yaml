name: banksos
description: Bank Soal Latihan Mahasiswa - POLBAN
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  mongo_dart: ^0.10.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Environment variables
  flutter_dotenv: ^5.1.0

  # ID generator untuk data offline
  uuid: ^4.3.3

  # Cek koneksi internet
  connectivity_plus: ^7.1.1

  # State management
  flutter_riverpod: ^2.5.1


  cupertino_icons: ^1.0.2
  bcrypt: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
